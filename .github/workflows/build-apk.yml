
name: Build Dawnbound Player APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DawnboundPlayer-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check project ZIP exists
        run: test -f DawnboundPlayer-Android-Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir project
          unzip -q DawnboundPlayer-Android-Project.zip -d project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -80

      - name: Locate Gradle project
        run: |
          BUILD_FILE="$(find project -name build.gradle -type f | head -1)"
          test -n "$BUILD_FILE"
          echo "BUILD_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper missing. Cannot build safely without a pinned Gradle version."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DawnboundPlayer-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
